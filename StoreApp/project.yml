name: PortlyCompanion

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    DEVELOPMENT_TEAM: UUFHFWGCU4
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"

targets:
  PortlyCompanion:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Portly.icns
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/PortlyCompanion.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.portly.companion
        PRODUCT_MODULE_NAME: PortlyCompanion
        PRODUCT_NAME: PortlyCompanion

  PortlyCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: PortlyCompanion
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.portly.companion.tests

schemes:
  PortlyCompanion:
    build:
      targets:
        PortlyCompanion: all
        PortlyCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PortlyCompanionTests
    archive:
      config: Release
